<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJ Modas | Marketplace Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style> body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; } </style>
</head>
<body class="text-slate-800 flex h-screen overflow-hidden">

    <aside class="w-64 bg-slate-900 text-white flex flex-col hidden md:flex">
        <div class="p-6 flex items-center gap-3 border-b border-slate-700">
            <i data-lucide="store" class="text-indigo-400"></i>
            <span class="text-xl font-bold tracking-wide">AJ Modas</span>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="#" class="flex items-center gap-3 p-3 bg-indigo-600 rounded-lg text-white font-medium">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Visão Geral
            </a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto relative">
        <header class="bg-white border-b border-slate-200 p-6 flex flex-col gap-4 sticky top-0 z-10 shadow-sm">
            <div class="flex justify-between items-start md:items-center flex-col xl:flex-row gap-4">
                <div>
                    <h1 class="text-2xl font-black text-slate-900 tracking-tight">Dashboard de Marketplace</h1>
                    <p class="text-sm font-medium text-slate-500 mt-1">Gestão agrupada e alertas automáticos.</p>
                </div>
                
                <div class="flex flex-col sm:flex-row gap-3 w-full xl:w-auto items-center">
                    
                    <div class="relative flex items-center" title="Base para Estoque Espelho">
                        <span class="absolute left-3 text-indigo-400 font-black">+</span>
                        <input type="number" id="baseEstoque" value="2000" class="w-24 pl-7 pr-3 py-2.5 bg-slate-100 border border-slate-200 rounded-lg focus:bg-white focus:border-indigo-500 outline-none transition text-center font-black text-indigo-700 shadow-sm">
                    </div>
                    
                    <button id="btnExportar" onclick="exportarUpSeller()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-lg font-bold flex items-center justify-center gap-2 shadow-md hover:shadow-lg transition w-full sm:w-auto">
                        <i data-lucide="file-archive" class="w-5 h-5"></i> Exportar ZIP UpSeller
                    </button>

                    <input type="file" id="inputCatalogoUpSeller" accept=".xlsx,.xls,.csv" style="display:none" onchange="uploadCatalogoUpSeller(this)">
                    <button id="btnUploadCatalogo" onclick="document.getElementById('inputCatalogoUpSeller').click()" class="bg-violet-600 hover:bg-violet-700 text-white px-5 py-2.5 rounded-lg font-bold flex items-center justify-center gap-2 shadow-md hover:shadow-lg transition w-full sm:w-auto" title="Enviar planilha do armazém UpSeller para matching exato de SKUs">
                        <i data-lucide="upload" class="w-5 h-5"></i> <span id="btnUploadTexto">Catálogo UpSeller</span>
                    </button>
                    
                    <button id="btnAlerta" onclick="dispararAlertaManual()" class="bg-rose-600 hover:bg-rose-700 text-white px-5 py-2.5 rounded-lg font-bold flex items-center justify-center gap-2 shadow-md hover:shadow-lg transition w-full sm:w-auto">
                        <i data-lucide="send" id="btnAlertaIcon" class="w-5 h-5"></i> Alerta WhatsApp
                    </button>
                </div>
            </div>

            <div class="flex flex-col md:flex-row justify-between items-center gap-4 mt-2">
                <div class="flex bg-slate-100 p-1 rounded-lg w-full md:w-auto overflow-x-auto">
                    <button onclick="mudarFiltro('todos', this)" class="filtro-btn px-4 py-2 text-sm font-semibold rounded-md bg-white shadow-sm text-indigo-700 transition whitespace-nowrap">
                        Todos os Modelos
                    </button>
                    <button onclick="mudarFiltro('alerta', this)" class="filtro-btn px-4 py-2 text-sm font-semibold rounded-md text-slate-600 hover:text-slate-900 transition flex items-center gap-1 whitespace-nowrap">
                        <i data-lucide="alert-triangle" class="w-4 h-4 text-rose-500"></i> Estoque Crítico
                    </button>
                    <button onclick="mudarFiltro('conjuntos', this)" class="filtro-btn px-4 py-2 text-sm font-semibold rounded-md text-slate-600 hover:text-slate-900 transition flex items-center gap-1 whitespace-nowrap">
                        <i data-lucide="shirt" class="w-4 h-4 text-emerald-500"></i> Conjuntos em Falta
                    </button>
                </div>

                <div class="relative w-full md:w-[400px]">
                    <i data-lucide="search" class="absolute left-3 top-2.5 text-slate-400 w-5 h-5"></i>
                    <input type="text" id="searchInput" placeholder="Digite a Ref exata (ex: 41), nome ou cor..." class="w-full pl-10 pr-4 py-2 bg-slate-100 border-transparent rounded-lg font-medium focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition">
                </div>
            </div>
        </header>

        <div class="p-6 space-y-6">
            <div id="loader" class="flex flex-col items-center justify-center py-20">
                <i data-lucide="loader-2" class="w-10 h-10 text-indigo-500 animate-spin mb-4"></i>
                <p class="text-slate-500 font-medium text-lg">Sincronizando as páginas do Bling...</p>
            </div>

            <div id="produtosGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 hidden"></div>
        </div>
    </main>

    <div id="modalProduto" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-5xl max-h-[90vh] flex flex-col overflow-hidden transition-all">
            <div class="p-5 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <div>
                    <span id="modalRef" class="text-xs font-bold text-indigo-500 uppercase tracking-wider bg-indigo-100 px-2 py-1 rounded-md hidden">Ref: --</span>
                    <h2 id="modalTitle" class="text-2xl font-black text-slate-800 leading-tight mt-1">Nome do Produto</h2>
                </div>
                <button onclick="fecharModal()" class="p-2 hover:bg-slate-200 rounded-full transition text-slate-500"><i data-lucide="x"></i></button>
            </div>
            <div class="p-6 overflow-y-auto flex-1 flex flex-col lg:flex-row gap-8">
                <div class="flex-1 flex flex-col">
                    <h3 class="text-lg font-bold mb-4 text-slate-700 flex items-center gap-2"><i data-lucide="bar-chart-2" class="w-5 h-5"></i> Estoque por Cor/Tamanho</h3>
                    <div class="flex-1 min-h-[300px] w-full bg-slate-50 border border-slate-100 rounded-xl p-4">
                        <canvas id="variacoesChart"></canvas>
                    </div>
                </div>
                <div class="w-full lg:w-96 flex flex-col">
                    <h3 class="text-lg font-bold mb-4 text-slate-700 flex items-center gap-2"><i data-lucide="list" class="w-5 h-5"></i> Lista de Variações</h3>
                    <div id="modalVariacoesList" class="space-y-3 overflow-y-auto pr-2 flex-1 max-h-[400px]"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let todosOsProdutos = [];
        let produtosAgrupados = [];
        let chartInstance = null;
        let abaAtiva = 'todos'; 

        // 👇 NOVA FUNÇÃO: BAIXAR O ZIP DA UPSELLER 👇
        async function exportarUpSeller() {
            const base = document.getElementById('baseEstoque').value || 2000;
            const btn = document.getElementById('btnExportar');
            const iconOriginal = btn.innerHTML;
            
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Compactando ZIP...`;
            btn.disabled = true;
            lucide.createIcons();

            try {
                // Chama a API pedindo o arquivo passando a base que o usuário digitou
                const response = await fetch(`/api/exportar-upseller?base=${base}`);
                if (!response.ok) throw new Error("Falha ao gerar arquivo.");
                
                // Mágica para fazer o download automático no navegador
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `UpSeller_Estoque_${new Date().toISOString().slice(0,10)}.zip`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
            } catch (e) {
                alert("❌ Erro ao exportar planilha. Verifique o terminal do servidor.");
            } finally {
                btn.innerHTML = iconOriginal;
                btn.disabled = false;
                lucide.createIcons();
            }
        }

        async function uploadCatalogoUpSeller(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            const btn = document.getElementById('btnUploadCatalogo');
            const textoOriginal = document.getElementById('btnUploadTexto').textContent;

            document.getElementById('btnUploadTexto').textContent = 'Enviando...';
            btn.disabled = true;

            try {
                const formData = new FormData();
                formData.append('arquivo', file);
                const resp = await fetch('/api/upseller/upload-catalogo', { method: 'POST', body: formData });
                const data = await resp.json();

                if (data.sucesso) {
                    document.getElementById('btnUploadTexto').textContent = `${data.total} SKUs`;
                    btn.classList.replace('bg-violet-600', 'bg-green-600');
                    btn.classList.replace('hover:bg-violet-700', 'hover:bg-green-700');
                    alert(`Catalogo UpSeller importado!\n${data.total} SKUs salvos.\n\nAgora a exportacao usara os SKUs exatos do seu armazem.`);
                } else {
                    alert('Erro: ' + (data.erro || 'Falha no upload'));
                    document.getElementById('btnUploadTexto').textContent = textoOriginal;
                }
            } catch (e) {
                alert('Erro ao enviar catalogo. Verifique o terminal.');
                document.getElementById('btnUploadTexto').textContent = textoOriginal;
            } finally {
                btn.disabled = false;
                input.value = '';
            }
        }

        // Verifica se já existe catálogo UpSeller salvo
        fetch('/api/upseller/catalogo-status').then(r => r.json()).then(data => {
            if (data.temCatalogo) {
                const btn = document.getElementById('btnUploadCatalogo');
                document.getElementById('btnUploadTexto').textContent = `${data.total} SKUs`;
                btn.classList.replace('bg-violet-600', 'bg-green-600');
                btn.classList.replace('hover:bg-violet-700', 'hover:bg-green-700');
            }
        }).catch(() => {});

        async function dispararAlertaManual() {
            const btn = document.getElementById('btnAlerta');
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Preparando envio...`;
            btn.classList.replace('bg-rose-600', 'bg-slate-400');
            btn.disabled = true;
            lucide.createIcons();

            try {
                await fetch('http://localhost:3000/api/disparar-alerta');
                alert("🚨 Ordem enviada! O Robô vai varrer o estoque e mandar no WhatsApp em alguns instantes.");
            } catch (e) {
                alert("❌ Erro ao comunicar. O terminal 'node index.js' está rodando?");
            } finally {
                btn.innerHTML = `<i data-lucide="send" class="w-5 h-5"></i> Alerta WhatsApp`;
                btn.classList.replace('bg-slate-400', 'bg-rose-600');
                btn.disabled = false;
                lucide.createIcons();
            }
        }

        function formatarProduto(p) {
            let cor = "Única", tam = "Único";
            let nomeLimpo = p.descricao || "Sem descrição";
            let refModelo = "";

            const regexRef = /^(\d+)\s*[-_]\s*/;
            const matchRef = nomeLimpo.match(regexRef);
            if (matchRef) {
                refModelo = matchRef[1]; 
                nomeLimpo = nomeLimpo.replace(matchRef[0], ""); 
            }

            const regexCor = /COR:\s*([^;]+)/i;
            const matchCor = nomeLimpo.match(regexCor);
            if (matchCor) { cor = matchCor[1].trim(); nomeLimpo = nomeLimpo.replace(regexCor, ""); }

            const regexTam = /TAM(?:ANHO)?:\s*([^;]+)/i;
            const matchTam = nomeLimpo.match(regexTam);
            if (matchTam) { tam = matchTam[1].trim(); nomeLimpo = nomeLimpo.replace(regexTam, ""); }

            nomeLimpo = nomeLimpo.replace(/;/g, "").replace(/\s{2,}/g, " ").trim();
            return { nomeLimpo, refModelo, cor, tam };
        }

        function agruparProdutos(produtosLista) {
            let grupos = {};
            produtosLista.forEach(p => {
                const { nomeLimpo, refModelo, cor, tam } = formatarProduto(p);
                if (!grupos[nomeLimpo]) grupos[nomeLimpo] = { nome: nomeLimpo, ref: refModelo, totalEstoque: 0, variacoes: [] };
                
                const quantidade = parseInt(p.saldoFisicoTotal) || 0;
                grupos[nomeLimpo].totalEstoque += quantidade;
                
                grupos[nomeLimpo].variacoes.push({ ...p, cor, tam });
            });
            return Object.values(grupos);
        }

        window.copiarDados = function(sku, nome, ref, cor, tam, estoque) {
            const nomeFinal = ref && ref !== 'undefined' ? `${ref}- ${nome}` : nome;
            const texto = `SKU: ${sku}\nProduto: ${nomeFinal}\nCor: ${cor}\nTamanho: ${tam}\nEstoque Atual: ${estoque} un.`;
            navigator.clipboard.writeText(texto).then(() => alert("✅ Dados Copiados!"));
        }

        function renderizarGrupos(gruposArray) {
            const grid = document.getElementById('produtosGrid');
            grid.innerHTML = '';

            if (gruposArray.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-slate-500 font-medium">Nenhum produto encontrado na busca.</div>`;
                return;
            }

            gruposArray.forEach((grupo, index) => {
                const alertaRuptura = grupo.variacoes.some(v => v.saldoFisicoTotal <= 10);
                const borderClass = alertaRuptura ? "border-rose-300" : "border-slate-200";
                
                const badgeRef = grupo.ref ? `<span class="px-2 py-1 bg-indigo-100 text-indigo-700 text-xs font-black rounded border border-indigo-200 shadow-sm">Ref: ${grupo.ref}</span>` : '';
                
                const card = `
                <div onclick="abrirModal(${index})" class="bg-white p-5 rounded-xl border ${borderClass} shadow-sm flex flex-col justify-between hover:shadow-md hover:border-indigo-400 transition cursor-pointer group">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex gap-2">
                                ${badgeRef}
                                <span class="px-2 py-1 bg-slate-100 text-slate-600 text-xs font-bold rounded border border-slate-200">${grupo.variacoes.length} un.</span>
                            </div>
                            ${alertaRuptura ? '<span class="flex items-center gap-1 text-xs font-bold text-rose-600 bg-rose-50 px-2 py-1 rounded-md"><i data-lucide="alert-circle" class="w-3 h-3"></i> Alerta</span>' : ''}
                        </div>
                        <h3 class="text-lg font-bold text-slate-900 leading-tight group-hover:text-indigo-600 transition mt-3">${grupo.nome}</h3>
                    </div>
                    <div class="mt-4 pt-4 border-t border-slate-100 flex justify-between items-center">
                        <div>
                            <p class="text-xs text-slate-400 font-medium">Estoque Total</p>
                            <p class="text-lg font-black text-slate-800">${grupo.totalEstoque} <span class="text-xs font-normal text-slate-500">peças</span></p>
                        </div>
                        <div class="w-8 h-8 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600 group-hover:bg-indigo-600 group-hover:text-white transition">
                            <i data-lucide="bar-chart" class="w-4 h-4"></i>
                        </div>
                    </div>
                </div>`;
                grid.innerHTML += card;
            });
            lucide.createIcons();
        }

        function aplicarFiltros() {
            const termoBusca = document.getElementById('searchInput').value.trim().toLowerCase();
            const palavrasBusca = termoBusca.split(/\s+/).filter(p => p !== '');

            const filtrados = produtosAgrupados.filter(grupo => {
                if (palavrasBusca.length === 0) return true;

                const matchTexto = palavrasBusca.every(palavra => {
                    if (grupo.ref && grupo.ref.toLowerCase() === palavra) return true;

                    const ehNumero = /^\d+$/.test(palavra);

                    if (ehNumero) {
                        return grupo.variacoes.some(v => v.codigo && v.codigo.toLowerCase() === palavra);
                    } else {
                        return (grupo.nome && grupo.nome.toLowerCase().includes(palavra)) || 
                               grupo.variacoes.some(v => 
                                   (v.cor && v.cor.toLowerCase().includes(palavra)) ||
                                   (v.tam && v.tam.toLowerCase().includes(palavra))
                               );
                    }
                });

                if (!matchTexto) return false;

                const isCritico = grupo.variacoes.some(v => v.saldoFisicoTotal <= 10);
                const isConjunto = grupo.nome.toLowerCase().includes('conjunto');

                if (abaAtiva === 'alerta') return isCritico;
                if (abaAtiva === 'conjuntos') return isCritico && isConjunto;
                return true; 
            });

            if(abaAtiva !== 'todos') {
                filtrados.sort((a,b) => Math.min(...a.variacoes.map(v=>v.saldoFisicoTotal)) - Math.min(...b.variacoes.map(v=>v.saldoFisicoTotal)));
            }

            window.gruposExibidos = filtrados;
            renderizarGrupos(filtrados);
        }

        window.mudarFiltro = function(novaAba, botaoClicado) {
            abaAtiva = novaAba;
            document.querySelectorAll('.filtro-btn').forEach(btn => {
                btn.classList.remove('bg-white', 'shadow-sm', 'text-indigo-700');
                btn.classList.add('text-slate-600');
            });
            botaoClicado.classList.remove('text-slate-600');
            botaoClicado.classList.add('bg-white', 'shadow-sm', 'text-indigo-700');
            aplicarFiltros();
        }

        document.getElementById('searchInput').addEventListener('input', aplicarFiltros);

        window.abrirModal = function(index) {
            const grupo = window.gruposExibidos[index];
            if(!grupo) return;
            
            document.getElementById('modalTitle').innerText = grupo.nome;
            
            const badgeRef = document.getElementById('modalRef');
            if (grupo.ref) {
                badgeRef.innerText = `Ref: ${grupo.ref}`;
                badgeRef.classList.remove('hidden');
                badgeRef.classList.add('inline-block');
            } else {
                badgeRef.classList.add('hidden');
                badgeRef.classList.remove('inline-block');
            }

            grupo.variacoes.sort((a, b) => b.saldoFisicoTotal - a.saldoFisicoTotal);

            const labels = grupo.variacoes.map(v => `${v.cor} (${v.tam})`);
            const data = grupo.variacoes.map(v => v.saldoFisicoTotal);
            const bgColors = data.map(val => val <= 10 ? '#F43F5E' : '#4F46E5'); 

            const ctx = document.getElementById('variacoesChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: { labels: labels, datasets: [{ label: 'Qtd', data: data, backgroundColor: bgColors, borderRadius: 6 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
            });

            const listHtml = grupo.variacoes.map(v => {
                const isAlerta = v.saldoFisicoTotal <= 10;
                return `
                <div class="p-3 bg-white border border-slate-200 rounded-xl shadow-sm flex justify-between items-center hover:border-indigo-200 transition">
                    <div>
                        <p class="text-xs text-slate-400 font-bold mb-1">SKU: ${v.codigo || 'S/COD'}</p>
                        <p class="text-sm font-bold text-slate-800">${v.cor} <span class="text-slate-400 font-normal">|</span> Tam: ${v.tam}</p>
                    </div>
                    <div class="text-right flex flex-col items-end gap-2">
                        <span class="px-2 py-1 text-xs font-bold rounded-md ${isAlerta ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'} border ${isAlerta ? 'border-rose-200' : 'border-emerald-200'}">${v.saldoFisicoTotal} un.</span>
                        <button onclick="event.stopPropagation(); copiarDados('${v.codigo}', '${grupo.nome.replace(/'/g, "\\'")}', '${grupo.ref || ''}', '${v.cor}', '${v.tam}', '${v.saldoFisicoTotal}')" class="text-indigo-600 hover:text-indigo-800 text-xs font-bold flex items-center gap-1 transition"><i data-lucide="copy" class="w-3 h-3"></i> Copiar</button>
                    </div>
                </div>`;
            }).join('');
            
            document.getElementById('modalVariacoesList').innerHTML = listHtml;
            document.getElementById('modalProduto').classList.remove('hidden');
            lucide.createIcons();
        }

        window.fecharModal = function() { document.getElementById('modalProduto').classList.add('hidden'); }

        async function carregarDados() {
            try {
                const response = await fetch('http://localhost:3000/api/produtos');
                todosOsProdutos = await response.json();
                produtosAgrupados = agruparProdutos(todosOsProdutos);
                
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('produtosGrid').classList.remove('hidden');
                
                aplicarFiltros(); 
            } catch (error) {
                alert("Erro ao conectar. O 'node index.js' está rodando no terminal?");
            }
        }

        carregarDados();
    </script>
</body>
</html>
