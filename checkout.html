<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS | Conferência de Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.15s ease-out; background-color: #F8FAFC; }
        .flash-success { background-color: #bbf7d0 !important; }
        .flash-error { background-color: #fecaca !important; }
        input:focus { box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 9999px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-slate-800">
    <audio id="beep-success" src="https://actions.google.com/sounds/v1/ui/check_mark_complete.ogg" preload="auto"></audio>
    <audio id="beep-error" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

    <!-- HEADER -->
    <header class="bg-white border-b border-slate-200 px-4 lg:px-6 py-3 flex flex-wrap items-center justify-between gap-3 shadow-sm z-30 shrink-0">
        <div class="flex items-center gap-2.5 min-w-0">
            <div class="bg-indigo-600 p-2 rounded-lg shadow-sm shrink-0"><i data-lucide="shield-check" class="text-white w-5 h-5"></i></div>
            <div class="min-w-0">
                <h1 class="text-lg lg:text-xl font-black text-slate-900 tracking-tight leading-none truncate">Checkout & Expedição</h1>
                <p class="text-xs font-medium text-slate-400 mt-0.5 hidden sm:block">Conferência Híbrida: Bling + Planilhas</p>
            </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
            <input type="file" id="csv-upload" accept=".csv, .xlsx, .pdf" class="hidden" onchange="enviarCSV(event)">
            <button onclick="document.getElementById('csv-upload').click()" class="flex items-center gap-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-3 py-2 rounded-lg font-bold text-xs transition-all border border-indigo-200">
                <i data-lucide="upload" class="w-3.5 h-3.5"></i>
                <span class="hidden sm:inline">Carregar</span> Ficheiros
            </button>
            <div id="status-badge" class="flex items-center gap-1.5 bg-blue-50 border border-blue-200 text-blue-700 px-3 py-2 rounded-full font-bold text-xs transition-all">
                <span class="relative flex h-2 w-2 shrink-0"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-blue-500"></span></span>
                <span id="status-texto" class="truncate max-w-[120px] sm:max-w-none">Iniciando...</span>
            </div>
        </div>
    </header>

    <!-- MAIN LAYOUT -->
    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden min-h-0">

        <!-- SIDEBAR -->
        <section class="w-full lg:w-[340px] xl:w-[380px] bg-white border-b lg:border-b-0 lg:border-r border-slate-200 flex flex-col relative z-20 shrink-0 overflow-y-auto lg:overflow-y-auto custom-scroll">
            <div class="p-4 lg:p-5 flex flex-col gap-4 flex-1">

                <!-- STEP 1: Pedido -->
                <div id="box-pedido" class="transition-all duration-300">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">1. Número do Pedido</label>
                    <div class="relative flex items-center">
                        <i data-lucide="shopping-bag" class="absolute left-3 text-indigo-400 w-5 h-5"></i>
                        <input type="text" id="input-pedido" placeholder="Bipe ou digite o Pedido..." class="w-full pl-10 pr-12 py-3 bg-slate-50 border-2 border-slate-200 rounded-xl text-base font-bold text-slate-800 outline-none transition-all placeholder:text-slate-400 focus:border-indigo-500 focus:bg-white">
                        <button onclick="dispararBusca()" class="absolute right-1.5 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 p-1.5 rounded-lg transition-colors"><i data-lucide="search" class="w-5 h-5"></i></button>
                    </div>
                </div>

                <!-- STEP 2: Conferir Peças -->
                <div id="box-produtos" class="hidden flex-col flex-1 opacity-0 transition-opacity duration-300">
                    <div class="bg-indigo-50/80 border border-indigo-100 p-4 rounded-xl relative">
                        <label class="block text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-1.5">2. Conferir Peças Físicas</label>
                        <div class="relative">
                            <i data-lucide="scan-barcode" class="absolute left-3 top-3 text-indigo-600 w-5 h-5 z-40"></i>
                            <input type="text" id="input-produto" oninput="filtrarItensPedido()" placeholder="Bipe ou digite o SKU / código de barras..." autocomplete="off" class="w-full pl-10 pr-4 py-3 bg-white border-2 border-indigo-200 rounded-xl text-base font-bold text-indigo-900 outline-none transition-all placeholder:text-indigo-300 focus:border-indigo-600 relative z-40">
                            <ul id="resultado-busca-produto" class="absolute left-0 w-full bg-white border border-indigo-200 rounded-xl shadow-2xl mt-1.5 max-h-56 overflow-y-auto hidden z-50 custom-scroll"></ul>
                        </div>
                    </div>

                    <div class="flex gap-2 mt-3">
                        <button onclick="abrirModalAdicionar()" class="flex-1 flex items-center justify-center gap-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 px-3 py-2 rounded-lg text-xs font-bold transition-all">
                            <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> Adicionar Item
                        </button>
                        <button onclick="desfazerUltimaAlteracao()" id="btn-desfazer" class="hidden flex items-center justify-center gap-1.5 bg-slate-50 hover:bg-slate-100 text-slate-600 border border-slate-200 px-3 py-2 rounded-lg text-xs font-bold transition-all">
                            <i data-lucide="undo-2" class="w-3.5 h-3.5"></i> Desfazer
                        </button>
                    </div>

                    <!-- Progresso + Finalizar -->
                    <div class="mt-auto pt-4">
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-bold text-slate-500">Progresso</span>
                                <span id="texto-progresso" class="text-base font-black text-indigo-600">0 / 0</span>
                            </div>
                            <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                                <div id="barra-progresso" class="bg-indigo-600 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
                            </div>
                            <button id="btn-finalizar" onclick="finalizarPacote()" disabled class="mt-4 w-full bg-emerald-500 hover:bg-emerald-600 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-black text-sm py-3 rounded-xl flex items-center justify-center gap-2 transition-all">
                                <i data-lucide="package-check" class="w-5 h-5"></i> FINALIZAR PACOTE
                            </button>
                            <button onclick="resetarTela()" class="mt-2 w-full text-slate-400 hover:text-slate-600 text-xs font-bold py-1.5 transition-colors">Cancelar / Voltar</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- ITEMS LIST -->
        <section class="flex-1 bg-slate-50/50 flex flex-col overflow-hidden min-w-0">
            <div class="px-4 lg:px-6 pt-4 lg:pt-5 pb-3 flex items-center justify-between gap-3 shrink-0">
                <div class="min-w-0">
                    <h2 class="text-lg lg:text-xl font-black text-slate-800 leading-tight">Itens do Pedido</h2>
                    <p id="info-pedido" class="text-slate-400 font-medium text-sm mt-0.5">Nenhum pedido carregado</p>
                </div>
                <div id="badge-origem" class="hidden px-2.5 py-1 rounded-md text-[10px] font-black uppercase shrink-0"></div>
            </div>
            <div class="flex-1 overflow-y-auto custom-scroll px-4 lg:px-6 pb-4">
                <ul id="lista-itens" class="space-y-3">
                    <div id="lista-vazia" class="h-full flex flex-col items-center justify-center text-center pt-20">
                        <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center mb-3 shadow-sm border border-slate-100"><i data-lucide="scan-barcode" class="w-8 h-8 text-slate-300"></i></div>
                        <p class="text-slate-400 font-medium text-sm">Bipe ou digite o número do pedido e aperte Enter.</p>
                    </div>
                </ul>
            </div>
        </section>
    </main>

    <!-- MODAL DE TROCA DE ITEM -->
    <div id="modal-troca" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white rounded-t-2xl sm:rounded-2xl shadow-2xl w-full sm:max-w-lg max-h-[85vh] sm:max-h-[80vh] flex flex-col overflow-hidden">
            <div class="p-4 sm:p-5 border-b border-slate-200">
                <div class="flex justify-between items-center mb-3">
                    <h3 id="modal-troca-titulo" class="text-lg font-black text-slate-900">Trocar Item do Pedido</h3>
                    <button onclick="fecharModalTroca()" class="text-slate-400 hover:text-slate-600 p-1 -mr-1"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <div id="troca-item-original" class="bg-rose-50 border border-rose-200 rounded-lg p-3 mb-3">
                    <p class="text-[10px] font-bold text-rose-400 uppercase mb-0.5">Removendo</p>
                    <p id="troca-nome-original" class="text-sm font-bold text-rose-700 break-words leading-snug"></p>
                    <p id="troca-sku-original" class="text-xs font-mono text-rose-500 mt-0.5"></p>
                </div>
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3 top-3 text-slate-400 w-4 h-4"></i>
                    <input type="text" id="input-busca-troca" oninput="buscarProdutoTroca()" placeholder="Buscar por SKU, nome, ref ou cor..." class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border-2 border-slate-200 rounded-lg text-sm font-bold outline-none focus:border-indigo-500 focus:bg-white placeholder:text-slate-400">
                </div>
            </div>
            <ul id="lista-busca-troca" class="flex-1 overflow-y-auto custom-scroll p-2">
                <li class="p-6 text-center text-slate-400 text-sm">Digite para buscar produtos do estoque...</li>
            </ul>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let pedidoAtual = null;
        let trocaIndexAtual = null;
        let timerBuscaTroca = null;
        let modalMode = 'troca'; // 'troca' ou 'adicionar'

        window.onload = async () => {
            alterarStatus("Sincronizando Bling...", 'buscando');
            try {
                // Sincroniza pedidos e pré-carrega produtos em paralelo
                const [resSync, resProd] = await Promise.all([
                    fetch('/api/checkout/sincronizar'),
                    fetch('/api/checkout/precarregar-produtos')
                ]);
                const dataSync = await resSync.json();
                const dataProd = await resProd.json();
                console.log('[Checkout] Pedidos:', dataSync, '| Produtos:', dataProd);
                if(dataSync.sucesso) alterarStatus("Sistema Pronto", 'sucesso');
                else alterarStatus("Pronto (Apenas Ficheiros)", 'alerta');
            } catch(e) { alterarStatus("Offline", 'erro'); }
        };

        // Mantém o foco e fecha a lista se clicar fora
        document.addEventListener('click', (e) => {
            if (e.target.closest('button')) return;
            
            if (!e.target.closest('#input-produto') && !e.target.closest('#resultado-busca-produto')) {
                const listaDropdown = document.getElementById('resultado-busca-produto');
                if (listaDropdown) listaDropdown.classList.add('hidden');
            }

            if (!document.getElementById('box-pedido').classList.contains('pointer-events-none')) {
                if (!pedidoAtual) document.getElementById('input-pedido').focus();
                else document.getElementById('input-produto').focus();
            }
        });

        function dispararBusca() { const val = document.getElementById('input-pedido').value.trim(); if(val !== '') buscarPedidoAPI(val); }
        document.getElementById('input-pedido').addEventListener('keypress', function(e) { if (e.key === 'Enter') dispararBusca(); });
        
        document.getElementById('input-produto').addEventListener('keypress', function(e) { 
            if (e.key === 'Enter' && this.value.trim() !== '') { 
                conferirPeça(this.value.trim()); 
            }
        });

        // 👇 NOVA FUNÇÃO: ABRE A LISTA SUSPENSA INTELIGENTE COM O "FALTAM: X"
        function filtrarItensPedido() {
            const termo = document.getElementById('input-produto').value.toLowerCase().trim();
            const listaDropdown = document.getElementById('resultado-busca-produto');
            listaDropdown.innerHTML = '';

            if (!pedidoAtual || termo.length === 0) {
                listaDropdown.classList.add('hidden');
                return;
            }

            // Procura dentro do pedido atual as peças que combinam com o que foi digitado (SKU, nome ou GTIN)
            const filtrados = pedidoAtual.itens.filter(i =>
                (String(i.sku).toLowerCase().includes(termo) || String(i.nome).toLowerCase().includes(termo) || (i.gtin && String(i.gtin).toLowerCase().includes(termo))) &&
                i.conferido < i.esperado
            );

            if (filtrados.length === 0) {
                listaDropdown.innerHTML = `<li class="p-4 text-slate-500 text-center font-medium text-sm">Nenhuma peça pendente combina com "${termo}".</li>`;
            } else {
                filtrados.forEach(item => {
                    const faltam = item.esperado - item.conferido;
                    listaDropdown.innerHTML += `
                        <li onclick="selecionarItemManual('${item.sku}')" class="p-4 hover:bg-indigo-50 border-b border-indigo-50 cursor-pointer flex justify-between items-center group transition-colors">
                            <div class="flex-1 pr-4">
                                <p class="font-bold text-slate-800 leading-tight text-sm">${item.nome}</p>
                                <p class="text-xs font-mono text-slate-500 mt-1">SKU: ${item.sku}</p>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="text-[10px] font-black text-orange-500 bg-orange-50 px-2 py-1 rounded tracking-wider uppercase border border-orange-100 shadow-sm">Faltam: ${faltam}</span>
                                <span class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition opacity-0 group-hover:opacity-100 shadow-md">✓ Bipar</span>
                            </div>
                        </li>
                    `;
                });
            }
            listaDropdown.classList.remove('hidden');
        }

        // Função chamada quando o operador clica na listinha suspensa
        function selecionarItemManual(skuExato) {
            document.getElementById('input-produto').value = '';
            document.getElementById('resultado-busca-produto').classList.add('hidden');
            conferirPeça(skuExato); 
            document.getElementById('input-produto').focus();
        }

        async function enviarCSV(event) {
            const file = event.target.files[0];
            if (!file) return;
            const formData = new FormData(); formData.append('arquivo', file);
            try {
                alterarStatus("Processando...", 'buscando');
                const response = await fetch('/api/checkout/upload-csv', { method: 'POST', body: formData });
                const result = await response.json();
                if (result.sucesso) { alert(`✅ Memória atualizada!`); alterarStatus("Sistema Pronto", 'sucesso'); document.getElementById('input-pedido').focus(); } 
                else { alert("Erro: " + result.erro); alterarStatus("Erro no ficheiro", 'erro'); }
            } catch (e) { alert("Erro de conexão."); alterarStatus("Erro", 'erro'); }
            event.target.value = ''; 
        }

        async function buscarPedidoAPI(numeroPedido) {
            alterarStatus(`Buscando ${numeroPedido}...`, 'buscando');
            document.getElementById('input-pedido').disabled = true;
            try {
                const response = await fetch(`/api/checkout/pedido/${numeroPedido}`);
                const data = await response.json();
                if (data.erro) { tocarErro(); alert(data.erro); resetarTela(); return; }
                pedidoAtual = data; tocarSucesso(); montarTelaPedido();
            } catch (e) { tocarErro(); alert("Falha ao comunicar com servidor."); resetarTela(); }
        }

        function montarTelaPedido() {
            alterarStatus("Em conferência", 'alerta'); 
            document.getElementById('box-pedido').classList.add('opacity-50', 'pointer-events-none');
            const boxProdutos = document.getElementById('box-produtos');
            boxProdutos.classList.remove('hidden'); setTimeout(() => boxProdutos.classList.remove('opacity-0'), 50);
            document.getElementById('info-pedido').innerHTML = `Pedido <strong>#${pedidoAtual.numero}</strong>`;
            const badgeOrigem = document.getElementById('badge-origem');
            badgeOrigem.classList.remove('hidden', 'bg-blue-100', 'text-blue-700', 'bg-orange-100', 'text-orange-700');
            if (pedidoAtual.origem === 'BLING') { badgeOrigem.innerText = "Site (Bling)"; badgeOrigem.classList.add('bg-blue-100', 'text-blue-700'); } 
            else { badgeOrigem.innerText = "Ficheiro / UpSeller"; badgeOrigem.classList.add('bg-orange-100', 'text-orange-700'); }
            atualizarListaInterface(); document.getElementById('input-produto').focus();
        }

        function conferirPeça(skuLido) {
            const skuTratado = String(skuLido).toLowerCase().trim();
            let itemEncontrado = pedidoAtual.itens.find(i => String(i.sku).toLowerCase() === skuTratado);

            // Tenta match por GTIN (código de barras) se não achou por SKU
            if (!itemEncontrado) {
                itemEncontrado = pedidoAtual.itens.find(i => i.gtin && String(i.gtin).toLowerCase() === skuTratado && i.conferido < i.esperado);
            }

            // Auto-complete inteligente
            if (!itemEncontrado) {
                const parciais = pedidoAtual.itens.filter(i => {
                    const matchSku = String(i.sku).toLowerCase().includes(skuTratado);
                    const matchNome = String(i.nome).toLowerCase().includes(skuTratado);
                    const matchGtin = i.gtin && String(i.gtin).toLowerCase().includes(skuTratado);
                    return (matchSku || matchNome || matchGtin) && i.conferido < i.esperado;
                });

                if (parciais.length === 1) {
                    itemEncontrado = parciais[0];
                } else if (parciais.length > 1) {
                    tocarErro();
                    document.getElementById('input-produto').value = skuLido;
                    filtrarItensPedido();
                    alert(`⚠️ MÚLTIPLAS VARIAÇÕES!\nExistem ${parciais.length} peças pendentes compatíveis com "${skuLido}". Por favor, clique na variação correta na lista abaixo.`);
                    return;
                }
            }

            if (itemEncontrado) {
                if (itemEncontrado.conferido < itemEncontrado.esperado) { 
                    itemEncontrado.conferido++; 
                    tocarSucesso(); 
                    document.getElementById('input-produto').value = '';
                    document.getElementById('resultado-busca-produto').classList.add('hidden');
                    atualizarListaInterface(); 
                } else { 
                    tocarErro(); alert(`❌ ERRO: O pedido exige apenas ${itemEncontrado.esperado} unidade(s) de ${itemEncontrado.sku}.`); 
                }
            } else { 
                tocarErro(); alert(`❌ PRODUTO INCORRETO!\nO SKU "${skuLido}" NÃO pertence a este pedido ou já foi conferido!`); 
            }
        }

        // 👇 A LISTA DA DIREITA AGORA FICA ESTÁTICA PARA MOSTRAR TODO O PEDIDO 👇
        function atualizarListaInterface() {
            const lista = document.getElementById('lista-itens'); 
            lista.innerHTML = '';
            let totalEsperado = 0, totalConferido = 0;
            
            pedidoAtual.itens.forEach(item => {
                totalEsperado += item.esperado; 
                totalConferido += item.conferido;
                
                const concluido = item.conferido === item.esperado;
                const bgClass = concluido ? 'bg-emerald-50/70 border-emerald-200' : 'bg-white border-slate-200 hover:border-indigo-300 hover:shadow-md cursor-pointer';
                const iconeClass = concluido ? 'text-emerald-500' : 'text-slate-300 group-hover:text-indigo-400';
                const iconName = concluido ? 'check-circle-2' : 'circle';
                
                const li = document.createElement('li');
                li.className = `group border rounded-xl shadow-sm transition-all duration-300 ${bgClass}`;

                if (!concluido) {
                    li.setAttribute('onclick', `selecionarItemManual('${item.sku}')`);
                    li.title = "Clique aqui para conferir este item";
                }

                const idx = pedidoAtual.itens.indexOf(item);
                const statusTag = item.trocado ? `<span class="text-[10px] font-black text-amber-600 bg-amber-50 px-1.5 py-0.5 rounded border border-amber-200 shrink-0">TROCADO</span>` : item.adicionado ? `<span class="text-[10px] font-black text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-200 shrink-0">ADICIONADO</span>` : '';
                const btnTroca = !concluido ? `<button onclick="event.stopPropagation(); trocarItem(${idx})" class="bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 p-1.5 rounded-lg text-xs font-bold transition-all" title="Trocar"><i data-lucide="repeat-2" class="w-3.5 h-3.5"></i></button>` : '';
                const btnRemover = !concluido ? `<button onclick="event.stopPropagation(); removerItem(${idx})" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 p-1.5 rounded-lg text-xs font-bold transition-all" title="Remover"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>` : '';

                li.innerHTML = `
                    <div class="p-3 lg:p-4 flex items-start gap-3">
                        <i data-lucide="${iconName}" class="w-6 h-6 ${iconeClass} transition-colors shrink-0 mt-0.5"></i>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-start gap-2 flex-wrap">
                                <p class="font-bold text-sm lg:text-base text-slate-800 break-words leading-snug">${item.nome}</p>
                                ${statusTag}
                            </div>
                            <p class="text-xs font-mono text-slate-400 mt-1">SKU: ${item.sku}</p>
                        </div>
                        <div class="flex items-center gap-1.5 shrink-0">
                            ${btnTroca}${btnRemover}
                            <div class="text-center ml-1.5 pl-2.5 border-l border-slate-200 min-w-[52px]">
                                <p class="text-[10px] font-bold text-slate-400 uppercase leading-none">Qtd</p>
                                <p class="text-xl lg:text-2xl font-black leading-tight ${concluido ? 'text-emerald-600' : 'text-slate-700'}">${item.conferido}<span class="text-sm text-slate-400">/${item.esperado}</span></p>
                            </div>
                        </div>
                    </div>`;
                lista.appendChild(li);
            });

            lucide.createIcons();
            document.getElementById('texto-progresso').innerText = `${totalConferido} / ${totalEsperado}`;
            document.getElementById('barra-progresso').style.width = `${totalEsperado === 0 ? 0 : Math.round((totalConferido / totalEsperado) * 100)}%`;
            
            const btnFinalizar = document.getElementById('btn-finalizar');
            if (totalConferido === totalEsperado && totalEsperado > 0) { 
                btnFinalizar.disabled = false; btnFinalizar.classList.add('animate-[pulse_2s_ease-in-out_infinite]'); alterarStatus("Pacote 100% Conferido!", 'sucesso'); 
            } else { 
                btnFinalizar.disabled = true; btnFinalizar.classList.remove('animate-[pulse_2s_ease-in-out_infinite]'); 
            }
        }

        // ── FUNÇÕES DE TROCA / ADICIONAR / REMOVER ITEM ──
        function trocarItem(index) {
            modalMode = 'troca';
            trocaIndexAtual = index;
            const item = pedidoAtual.itens[index];
            document.getElementById('modal-troca-titulo').textContent = 'Trocar Item do Pedido';
            document.getElementById('troca-item-original').classList.remove('hidden');
            document.getElementById('troca-nome-original').textContent = item.nome;
            document.getElementById('troca-sku-original').textContent = `SKU: ${item.sku}`;
            document.getElementById('input-busca-troca').value = '';
            document.getElementById('lista-busca-troca').innerHTML = '<li class="p-6 text-center text-slate-400 text-sm">Digite para buscar produtos do estoque...</li>';
            document.getElementById('modal-troca').classList.remove('hidden');
            lucide.createIcons();
            setTimeout(() => document.getElementById('input-busca-troca').focus(), 100);
        }

        function abrirModalAdicionar() {
            if (!pedidoAtual) return;
            modalMode = 'adicionar';
            trocaIndexAtual = null;
            document.getElementById('modal-troca-titulo').textContent = 'Adicionar Item ao Pedido';
            document.getElementById('troca-item-original').classList.add('hidden');
            document.getElementById('input-busca-troca').value = '';
            document.getElementById('lista-busca-troca').innerHTML = '<li class="p-6 text-center text-slate-400 text-sm">Digite para buscar produtos do estoque...</li>';
            document.getElementById('modal-troca').classList.remove('hidden');
            lucide.createIcons();
            setTimeout(() => document.getElementById('input-busca-troca').focus(), 100);
        }

        function fecharModalTroca() {
            document.getElementById('modal-troca').classList.add('hidden');
            trocaIndexAtual = null;
            document.getElementById('input-produto').focus();
        }

        function buscarProdutoTroca() {
            clearTimeout(timerBuscaTroca);
            const termo = document.getElementById('input-busca-troca').value.trim();
            if (termo.length < 2) {
                document.getElementById('lista-busca-troca').innerHTML = '<li class="p-6 text-center text-slate-400 text-sm">Digite pelo menos 2 caracteres...</li>';
                return;
            }
            document.getElementById('lista-busca-troca').innerHTML = '<li class="p-6 text-center text-slate-400 text-sm"><i data-lucide="loader-2" class="w-5 h-5 animate-spin inline-block mr-2"></i>Buscando...</li>';
            lucide.createIcons();
            timerBuscaTroca = setTimeout(async () => {
                try {
                    const res = await fetch(`/api/checkout/buscar-produtos?q=${encodeURIComponent(termo)}`);
                    const data = await res.json();
                    const lista = document.getElementById('lista-busca-troca');

                    // Verifica se o backend retornou erro (cache vazio, etc)
                    if (data.erro) {
                        lista.innerHTML = `<li class="p-6 text-center text-amber-500 text-sm"><i data-lucide="alert-triangle" class="w-5 h-5 inline-block mr-2"></i>${data.mensagem || 'Catálogo não carregado. Acesse o Dashboard e sincronize primeiro.'}</li>`;
                        lucide.createIcons();
                        return;
                    }

                    const produtos = Array.isArray(data) ? data : [];
                    if (produtos.length === 0) {
                        lista.innerHTML = '<li class="p-6 text-center text-slate-400 text-sm">Nenhum produto encontrado.</li>';
                        return;
                    }
                    const callbackName = modalMode === 'adicionar' ? 'confirmarAdicao' : 'confirmarTroca';
                    lista.innerHTML = produtos.map(p => `
                        <li onclick='${callbackName}(${JSON.stringify(p).replace(/'/g, "&#39;")})' class="p-3 mx-1 mb-1 hover:bg-indigo-50 rounded-xl cursor-pointer flex justify-between items-start group transition-colors border border-transparent hover:border-indigo-200">
                            <div class="flex-1 min-w-0 pr-3">
                                <p class="font-bold text-sm text-slate-800 break-words leading-snug">${p.descricao}</p>
                                <p class="text-xs font-mono text-slate-400 mt-0.5">${p.codigo || 'Sem código'}</p>
                            </div>
                            <div class="flex items-center gap-2 shrink-0 mt-0.5">
                                <span class="text-xs font-bold ${p.saldoFisicoTotal > 0 ? 'text-emerald-600 bg-emerald-50 border-emerald-200' : 'text-rose-600 bg-rose-50 border-rose-200'} px-2 py-1 rounded border">Est: ${p.saldoFisicoTotal}</span>
                                <span class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold opacity-0 group-hover:opacity-100 transition shadow-md">Selecionar</span>
                            </div>
                        </li>
                    `).join('');
                } catch (e) {
                    document.getElementById('lista-busca-troca').innerHTML = '<li class="p-6 text-center text-rose-400 text-sm">Erro na busca. Tente novamente.</li>';
                }
            }, 350);
        }

        function confirmarTroca(novoProduto) {
            const itemOriginal = pedidoAtual.itens[trocaIndexAtual];
            const confirma = confirm(`Confirma a troca?\n\n❌ REMOVER: ${itemOriginal.nome}\n    SKU: ${itemOriginal.sku}\n\n✅ COLOCAR: ${novoProduto.descricao}\n    Código: ${novoProduto.codigo}\n    Estoque: ${novoProduto.saldoFisicoTotal}`);
            if (!confirma) return;

            // Inicializa array de trocas se não existir
            if (!pedidoAtual.trocas) pedidoAtual.trocas = [];

            // Registra a troca para o backend processar o estoque
            pedidoAtual.trocas.push({
                originalSku: itemOriginal.sku,
                originalNome: itemOriginal.nome,
                originalProdutoId: itemOriginal.produtoId || null,
                novoCodigo: novoProduto.codigo,
                novoNome: novoProduto.descricao,
                novoProdutoId: novoProduto.id,
                quantidade: itemOriginal.esperado
            });

            // Substitui o item na lista do pedido
            pedidoAtual.itens[trocaIndexAtual] = {
                sku: novoProduto.codigo || novoProduto.id,
                nome: novoProduto.descricao,
                esperado: itemOriginal.esperado,
                conferido: 0,
                trocado: true,
                produtoId: novoProduto.id
            };

            fecharModalTroca();
            atualizarListaInterface();
            tocarSucesso();
        }

        function confirmarAdicao(novoProduto) {
            const qtdStr = prompt(`Quantas unidades de "${novoProduto.descricao}" deseja adicionar?`, '1');
            if (!qtdStr) return;
            const qtd = parseInt(qtdStr);
            if (isNaN(qtd) || qtd < 1) { alert('Quantidade inválida.'); return; }

            if (!pedidoAtual.adicionados) pedidoAtual.adicionados = [];

            pedidoAtual.adicionados.push({
                codigo: novoProduto.codigo,
                nome: novoProduto.descricao,
                produtoId: novoProduto.id,
                quantidade: qtd
            });

            pedidoAtual.itens.push({
                sku: novoProduto.codigo || novoProduto.id,
                nome: novoProduto.descricao,
                esperado: qtd,
                conferido: 0,
                adicionado: true,
                produtoId: novoProduto.id
            });

            fecharModalTroca();
            atualizarListaInterface();
            atualizarBtnDesfazer();
            tocarSucesso();
        }

        function removerItem(index) {
            const item = pedidoAtual.itens[index];
            const confirma = confirm(`Remover "${item.nome}" (${item.esperado}x) do pedido?`);
            if (!confirma) return;

            if (!pedidoAtual.removidos) pedidoAtual.removidos = [];

            pedidoAtual.removidos.push({
                sku: item.sku,
                nome: item.nome,
                produtoId: item.produtoId || null,
                quantidade: item.esperado
            });

            pedidoAtual.itens.splice(index, 1);
            atualizarListaInterface();
            atualizarBtnDesfazer();
            tocarSucesso();
        }

        function desfazerUltimaAlteracao() {
            // Desfaz a última operação (troca, adição ou remoção)
            const trocas = pedidoAtual.trocas || [];
            const adicionados = pedidoAtual.adicionados || [];
            const removidos = pedidoAtual.removidos || [];

            if (trocas.length === 0 && adicionados.length === 0 && removidos.length === 0) return;

            // Encontra qual foi a mais recente (simplesmente desfaz a última de cada tipo verificando)
            // Para simplificar: prioriza remoção > adição > troca (último adicionado em cada array)
            if (removidos.length > 0) {
                const ultimo = removidos.pop();
                pedidoAtual.itens.push({
                    sku: ultimo.sku,
                    nome: ultimo.nome,
                    esperado: ultimo.quantidade,
                    conferido: 0,
                    produtoId: ultimo.produtoId
                });
            } else if (adicionados.length > 0) {
                adicionados.pop();
                // Remove o último item adicionado da lista
                for (let i = pedidoAtual.itens.length - 1; i >= 0; i--) {
                    if (pedidoAtual.itens[i].adicionado) {
                        pedidoAtual.itens.splice(i, 1);
                        break;
                    }
                }
            } else if (trocas.length > 0) {
                const ultima = trocas.pop();
                // Encontra o item trocado e reverte
                const idx = pedidoAtual.itens.findIndex(i => i.trocado && i.produtoId === ultima.novoProdutoId);
                if (idx !== -1) {
                    pedidoAtual.itens[idx] = {
                        sku: ultima.originalSku,
                        nome: ultima.originalNome,
                        esperado: ultima.quantidade,
                        conferido: 0,
                        produtoId: ultima.originalProdutoId
                    };
                }
            }

            atualizarListaInterface();
            atualizarBtnDesfazer();
        }

        function atualizarBtnDesfazer() {
            const btn = document.getElementById('btn-desfazer');
            const temAlteracoes = (pedidoAtual.trocas?.length || 0) + (pedidoAtual.adicionados?.length || 0) + (pedidoAtual.removidos?.length || 0);
            if (temAlteracoes > 0) btn.classList.remove('hidden');
            else btn.classList.add('hidden');
        }

        async function finalizarPacote() {
            const btn = document.getElementById('btn-finalizar'); btn.innerHTML = `<i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i> SINCRONIZANDO...`; btn.disabled = true; lucide.createIcons();
            try {
                const payload = { ...pedidoAtual, trocas: pedidoAtual.trocas || [], adicionados: pedidoAtual.adicionados || [], removidos: pedidoAtual.removidos || [] };
                const response = await fetch('/api/checkout/finalizar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const result = await response.json();
                if (result.sucesso) { tocarSucesso(); alert(`📦 PACOTE LIBERADO!`); resetarTela(); } 
                else { tocarErro(); alert("Erro no Bling."); btn.innerHTML = "TENTAR NOVAMENTE"; btn.disabled = false; }
            } catch (e) { tocarErro(); alert("Falha de conexão."); btn.innerHTML = "TENTAR NOVAMENTE"; btn.disabled = false; }
        }

        function resetarTela() {
            pedidoAtual = null; document.getElementById('input-pedido').disabled = false; document.getElementById('input-pedido').value = '';
            document.getElementById('box-pedido').classList.remove('opacity-50', 'pointer-events-none');
            document.getElementById('box-produtos').classList.add('opacity-0'); setTimeout(() => document.getElementById('box-produtos').classList.add('hidden'), 300);
            
            const listaBusca = document.getElementById('resultado-busca-produto');
            if (listaBusca) { listaBusca.classList.add('hidden'); listaBusca.innerHTML = ''; }

            document.getElementById('info-pedido').innerText = "Nenhum pedido carregado"; document.getElementById('badge-origem').classList.add('hidden');
            document.getElementById('lista-itens').innerHTML = `<div class="h-full flex flex-col items-center justify-center pt-20"><div class="w-20 h-20 bg-white rounded-full flex items-center justify-center mb-3 shadow-sm border border-slate-100"><i data-lucide="scan-barcode" class="w-8 h-8 text-slate-300"></i></div><p class="text-slate-400 font-medium text-sm">Bipe ou digite o número do pedido e aperte Enter.</p></div>`;
            document.getElementById('barra-progresso').style.width = '0%'; document.getElementById('texto-progresso').innerText = '0 / 0';
            const btnFinalizar = document.getElementById('btn-finalizar'); btnFinalizar.disabled = true; btnFinalizar.classList.remove('animate-[pulse_2s_ease-in-out_infinite]'); btnFinalizar.innerHTML = `<i data-lucide="package-check" class="w-6 h-6"></i> FINALIZAR PACOTE`;
            alterarStatus("Sistema Pronto", 'sucesso'); lucide.createIcons(); document.getElementById('input-pedido').focus();
        }

        function alterarStatus(mensagem, tipo) {
            const badge = document.getElementById('status-badge'); document.getElementById('status-texto').innerText = mensagem;
            badge.className = "flex items-center gap-1.5 px-3 py-2 rounded-full font-bold text-xs transition-all ";
            if(tipo === 'buscando') badge.className += "bg-blue-50 border border-blue-200 text-blue-700";
            if(tipo === 'sucesso') badge.className += "bg-emerald-50 border border-emerald-200 text-emerald-700";
            if(tipo === 'erro') badge.className += "bg-rose-50 border border-rose-200 text-rose-700";
            if(tipo === 'alerta') badge.className += "bg-amber-50 border border-amber-200 text-amber-700";
        }
        function tocarSucesso() { document.getElementById('beep-success').play().catch(()=>{}); document.body.classList.add('flash-success'); setTimeout(() => document.body.classList.remove('flash-success'), 150); }
        function tocarErro() { document.getElementById('beep-error').play().catch(()=>{}); document.body.classList.add('flash-error'); setTimeout(() => document.body.classList.remove('flash-error'), 400); }
    </script>
</body>
